<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-label="Meeting Tycoon — a satirical corporate management sim">
  <title>Meeting Tycoon</title>
  <desc>Hero image: a Microsoft Teams / Outlook-styled phone showing an overbooked calendar, surrounded by floating KPI chips and chat snippets.</desc>

  <!-- ── Background gradient (brand purple → indigo) ── -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6D28D9"/>
      <stop offset="1" stop-color="#4C1D95"/>
    </linearGradient>
    <linearGradient id="bezel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1F2937"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="meetingHigh" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FECDD3"/>
      <stop offset="1" stop-color="#FDA4AF"/>
    </linearGradient>
    <linearGradient id="meetingMed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDE68A"/>
      <stop offset="1" stop-color="#FCD34D"/>
    </linearGradient>
    <linearGradient id="meetingBrand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#DDD6FE"/>
      <stop offset="1" stop-color="#C4B5FD"/>
    </linearGradient>
    <linearGradient id="meetingCrisis" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FCA5A5"/>
      <stop offset="1" stop-color="#F87171"/>
    </linearGradient>
    <linearGradient id="emerald" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A7F3D0"/>
      <stop offset="1" stop-color="#6EE7B7"/>
    </linearGradient>
    <filter id="phoneShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#0F172A" flood-opacity="0.45"/>
    </filter>
    <filter id="chipShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="1200" height="600" fill="url(#bg)"/>

  <!-- ── Subtle dotted grid in background ── -->
  <g fill="#FFFFFF" opacity="0.06">
    <circle cx="60" cy="80" r="1.5"/>
    <circle cx="120" cy="80" r="1.5"/>
    <circle cx="180" cy="80" r="1.5"/>
    <circle cx="240" cy="80" r="1.5"/>
    <circle cx="60" cy="160" r="1.5"/>
    <circle cx="120" cy="160" r="1.5"/>
    <circle cx="180" cy="160" r="1.5"/>
    <circle cx="240" cy="160" r="1.5"/>
    <circle cx="60" cy="240" r="1.5"/>
    <circle cx="120" cy="240" r="1.5"/>
    <circle cx="180" cy="240" r="1.5"/>
    <circle cx="240" cy="240" r="1.5"/>
    <circle cx="60" cy="320" r="1.5"/>
    <circle cx="120" cy="320" r="1.5"/>
    <circle cx="180" cy="320" r="1.5"/>
    <circle cx="240" cy="320" r="1.5"/>
    <circle cx="60" cy="400" r="1.5"/>
    <circle cx="120" cy="400" r="1.5"/>
    <circle cx="180" cy="400" r="1.5"/>
    <circle cx="240" cy="400" r="1.5"/>
    <circle cx="60" cy="480" r="1.5"/>
    <circle cx="120" cy="480" r="1.5"/>
    <circle cx="180" cy="480" r="1.5"/>
    <circle cx="240" cy="480" r="1.5"/>

    <circle cx="960" cy="80" r="1.5"/>
    <circle cx="1020" cy="80" r="1.5"/>
    <circle cx="1080" cy="80" r="1.5"/>
    <circle cx="1140" cy="80" r="1.5"/>
    <circle cx="960" cy="160" r="1.5"/>
    <circle cx="1020" cy="160" r="1.5"/>
    <circle cx="1080" cy="160" r="1.5"/>
    <circle cx="1140" cy="160" r="1.5"/>
    <circle cx="960" cy="240" r="1.5"/>
    <circle cx="1020" cy="240" r="1.5"/>
    <circle cx="1080" cy="240" r="1.5"/>
    <circle cx="1140" cy="240" r="1.5"/>
    <circle cx="960" cy="320" r="1.5"/>
    <circle cx="1020" cy="320" r="1.5"/>
    <circle cx="1080" cy="320" r="1.5"/>
    <circle cx="1140" cy="320" r="1.5"/>
    <circle cx="960" cy="400" r="1.5"/>
    <circle cx="1020" cy="400" r="1.5"/>
    <circle cx="1080" cy="400" r="1.5"/>
    <circle cx="1140" cy="400" r="1.5"/>
    <circle cx="960" cy="480" r="1.5"/>
    <circle cx="1020" cy="480" r="1.5"/>
    <circle cx="1080" cy="480" r="1.5"/>
    <circle cx="1140" cy="480" r="1.5"/>
  </g>

  <!-- ── Title block (left) ── -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="60" y="180" fill="#FFFFFF" font-size="56" font-weight="800" letter-spacing="-1">Meeting</text>
    <text x="60" y="240" fill="#FFFFFF" font-size="56" font-weight="800" letter-spacing="-1">Tycoon</text>
    <text x="60" y="285" fill="#DDD6FE" font-size="18" font-weight="500">A satirical corporate management sim.</text>
    <text x="60" y="312" fill="#C4B5FD" font-size="14" font-style="italic">Schedule meetings. Survive politics. Maintain the illusion.</text>

    <!-- Tag chips -->
    <g transform="translate(60 350)">
      <rect width="92" height="26" rx="13" fill="#FFFFFF" opacity="0.12"/>
      <text x="46" y="17" fill="#FFFFFF" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.5">REACT · TS</text>
    </g>
    <g transform="translate(162 350)">
      <rect width="92" height="26" rx="13" fill="#FFFFFF" opacity="0.12"/>
      <text x="46" y="17" fill="#FFFFFF" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.5">VITE · ZUSTAND</text>
    </g>
    <g transform="translate(264 350)">
      <rect width="76" height="26" rx="13" fill="#FFFFFF" opacity="0.12"/>
      <text x="38" y="17" fill="#FFFFFF" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.5">TAILWIND</text>
    </g>

    <text x="60" y="430" fill="#FFFFFF" opacity="0.55" font-size="11" font-weight="700" letter-spacing="2">STAGE 1 · WEEK 1</text>
  </g>

  <!-- ── Phone mockup (right-center) ── -->
  <g transform="translate(580 60)" filter="url(#phoneShadow)">
    <!-- Bezel -->
    <rect x="0" y="0" width="360" height="480" rx="36" fill="url(#bezel)"/>
    <!-- Screen -->
    <rect x="10" y="12" width="340" height="456" rx="28" fill="#FFFFFF"/>

    <!-- ── App bar ── -->
    <rect x="10" y="12" width="340" height="56" rx="28" fill="#FFFFFF"/>
    <rect x="10" y="40" width="340" height="28" fill="#FFFFFF"/>
    <text x="30" y="42" fill="#94A3B8" font-size="9" font-weight="700" letter-spacing="2" font-family="-apple-system, sans-serif">STAGE 1 · DAY 3</text>
    <text x="30" y="60" fill="#1E293B" font-size="16" font-weight="700" font-family="-apple-system, sans-serif">Wednesday</text>
    <!-- Inbox pill -->
    <rect x="270" y="40" width="68" height="26" rx="4" fill="#EDE9FE" stroke="#DDD6FE"/>
    <text x="288" y="57" fill="#6D28D9" font-size="10" font-weight="700" font-family="-apple-system, sans-serif">Inbox</text>
    <circle cx="326" cy="53" r="9" fill="#7C3AED"/>
    <text x="326" y="56" fill="#FFFFFF" font-size="9" font-weight="800" text-anchor="middle" font-family="-apple-system, sans-serif">4</text>

    <!-- Divider -->
    <rect x="10" y="78" width="340" height="1" fill="#E2E8F0"/>

    <!-- Goals pill row -->
    <g font-family="-apple-system, sans-serif">
      <text x="30" y="98" fill="#64748B" font-size="9" font-weight="700" letter-spacing="1.5">GOALS</text>
      <rect x="76" y="92" width="28" height="6" rx="3" fill="#10B981"/>
      <rect x="108" y="92" width="28" height="6" rx="3" fill="#10B981"/>
      <rect x="140" y="92" width="28" height="6" rx="3" fill="#E2E8F0"/>
      <rect x="172" y="92" width="28" height="6" rx="3" fill="#10B981"/>
      <rect x="204" y="92" width="28" height="6" rx="3" fill="#E2E8F0"/>
      <text x="316" y="98" fill="#475569" font-size="10" font-weight="800" text-anchor="end">3/5</text>
    </g>

    <!-- Capacity row -->
    <rect x="10" y="106" width="340" height="22" fill="#F8FAFC"/>
    <text x="30" y="121" fill="#64748B" font-size="10" font-family="-apple-system, sans-serif">
      <tspan font-weight="700" fill="#334155">4</tspan> on calendar · <tspan font-weight="700" fill="#334155">5.5h</tspan> booked · <tspan font-weight="700" fill="#10B981">3.5h</tspan> focus
    </text>
    <text x="338" y="121" fill="#475569" font-size="10" font-weight="700" text-anchor="end" font-family="-apple-system, sans-serif">1/5 left</text>

    <!-- ── Agenda grid ── -->
    <g font-family="-apple-system, sans-serif">
      <!-- Time labels -->
      <text x="28" y="160" fill="#94A3B8" font-size="9" font-weight="700" text-anchor="end">9 AM</text>
      <text x="28" y="194" fill="#94A3B8" font-size="9" font-weight="700" text-anchor="end">10 AM</text>
      <text x="28" y="228" fill="#94A3B8" font-size="9" font-weight="700" text-anchor="end">11 AM</text>
      <text x="28" y="262" fill="#94A3B8" font-size="9" font-weight="700" text-anchor="end">12 PM</text>
      <text x="28" y="296" fill="#94A3B8" font-size="9" font-weight="700" text-anchor="end">1 PM</text>
      <text x="28" y="330" fill="#94A3B8" font-size="9" font-weight="700" text-anchor="end">2 PM</text>
      <text x="28" y="364" fill="#94A3B8" font-size="9" font-weight="700" text-anchor="end">3 PM</text>
      <text x="28" y="398" fill="#94A3B8" font-size="9" font-weight="700" text-anchor="end">4 PM</text>

      <!-- Dashed gridlines -->
      <line x1="40" y1="156" x2="338" y2="156" stroke="#E2E8F0" stroke-dasharray="2 3"/>
      <line x1="40" y1="190" x2="338" y2="190" stroke="#E2E8F0" stroke-dasharray="2 3"/>
      <line x1="40" y1="224" x2="338" y2="224" stroke="#E2E8F0" stroke-dasharray="2 3"/>
      <line x1="40" y1="258" x2="338" y2="258" stroke="#E2E8F0" stroke-dasharray="2 3"/>
      <line x1="40" y1="292" x2="338" y2="292" stroke="#E2E8F0" stroke-dasharray="2 3"/>
      <line x1="40" y1="326" x2="338" y2="326" stroke="#E2E8F0" stroke-dasharray="2 3"/>
      <line x1="40" y1="360" x2="338" y2="360" stroke="#E2E8F0" stroke-dasharray="2 3"/>
      <line x1="40" y1="394" x2="338" y2="394" stroke="#E2E8F0" stroke-dasharray="2 3"/>

      <!-- Meeting blocks -->
      <!-- 9-9:30 Standup (recurring) -->
      <g>
        <rect x="44" y="138" width="288" height="28" rx="4" fill="url(#meetingBrand)" stroke="#A78BFA" stroke-width="0.5"/>
        <rect x="44" y="138" width="4" height="28" fill="#7C3AED"/>
        <text x="56" y="156" fill="#1E1B4B" font-size="11" font-weight="700">Team Standup</text>
      </g>
      <!-- 10-11 1on1 (medium) -->
      <g>
        <rect x="44" y="190" width="288" height="34" rx="4" fill="url(#meetingMed)" stroke="#F59E0B" stroke-width="0.5"/>
        <rect x="44" y="190" width="4" height="34" fill="#D97706"/>
        <text x="56" y="210" fill="#78350F" font-size="11" font-weight="700">1:1 with Manager</text>
        <text x="56" y="222" fill="#92400E" font-size="9">10:00 AM – 10:30 AM</text>
      </g>
      <!-- 11-12 Stakeholder sync (high) -->
      <g>
        <rect x="44" y="224" width="288" height="34" rx="4" fill="url(#meetingHigh)" stroke="#F43F5E" stroke-width="0.5"/>
        <rect x="44" y="224" width="4" height="34" fill="#E11D48"/>
        <text x="56" y="244" fill="#881337" font-size="11" font-weight="700">Stakeholder Sync</text>
        <text x="56" y="256" fill="#9F1239" font-size="9">11:00 AM – 12:00 PM</text>
      </g>
      <!-- 2-3 Eng escalation (crisis) -->
      <g>
        <rect x="44" y="326" width="288" height="34" rx="4" fill="url(#meetingCrisis)" stroke="#DC2626" stroke-width="0.5"/>
        <rect x="44" y="326" width="4" height="34" fill="#B91C1C"/>
        <text x="56" y="346" fill="#7F1D1D" font-size="11" font-weight="700">Engineering Escalation</text>
        <text x="56" y="358" fill="#991B1B" font-size="9">2:00 PM – 3:00 PM · CRISIS</text>
      </g>
    </g>

    <!-- Footer button -->
    <rect x="20" y="420" width="320" height="38" rx="6" fill="#7C3AED"/>
    <text x="180" y="445" fill="#FFFFFF" font-size="13" font-weight="700" text-anchor="middle" font-family="-apple-system, sans-serif">End Day 3 →</text>
  </g>

  <!-- ── Floating KPI chip (top-left of phone) ── -->
  <g transform="translate(390 100)" filter="url(#chipShadow)">
    <rect width="170" height="58" rx="8" fill="#FFFFFF"/>
    <rect width="4" height="58" rx="2" fill="#10B981"/>
    <text x="16" y="22" fill="#94A3B8" font-size="9" font-weight="700" letter-spacing="1.5" font-family="-apple-system, sans-serif">PRODUCTIVITY</text>
    <text x="16" y="46" fill="#1E293B" font-size="22" font-weight="800" font-family="-apple-system, sans-serif">62</text>
    <g transform="translate(70 30)">
      <text x="0" y="14" fill="#10B981" font-size="12" font-weight="700" font-family="-apple-system, sans-serif">▲ 4</text>
    </g>
    <text x="120" y="48" fill="#94A3B8" font-size="10" font-family="-apple-system, sans-serif">/100</text>
  </g>

  <!-- ── Floating chat snippet (bottom-left of phone) ── -->
  <g transform="translate(380 405)" filter="url(#chipShadow)">
    <rect width="190" height="62" rx="8" fill="#FFFFFF"/>
    <circle cx="22" cy="22" r="13" fill="#7C3AED"/>
    <text x="22" y="26" fill="#FFFFFF" font-size="11" font-weight="800" text-anchor="middle" font-family="-apple-system, sans-serif">DS</text>
    <text x="44" y="20" fill="#0F172A" font-size="11" font-weight="700" font-family="-apple-system, sans-serif">Dev S.</text>
    <text x="84" y="20" fill="#94A3B8" font-size="9" font-family="-apple-system, sans-serif">· #engineering</text>
    <text x="44" y="36" fill="#334155" font-size="11" font-style="italic" font-family="-apple-system, sans-serif">"shipped something today 🚀"</text>
    <text x="44" y="52" fill="#94A3B8" font-size="9" font-family="-apple-system, sans-serif">🚀 🙌</text>
  </g>

  <!-- ── Floating boss feedback chip (right of phone) ── -->
  <g transform="translate(960 200)" filter="url(#chipShadow)">
    <rect width="200" height="86" rx="8" fill="#FFFFFF"/>
    <rect width="4" height="86" rx="2" fill="#F43F5E"/>
    <text x="16" y="22" fill="#94A3B8" font-size="9" font-weight="700" letter-spacing="1.5" font-family="-apple-system, sans-serif">BOSS FEEDBACK</text>
    <circle cx="28" cy="46" r="14" fill="#1E1B4B"/>
    <text x="28" y="50" fill="#FFFFFF" font-size="10" font-weight="800" text-anchor="middle" font-family="-apple-system, sans-serif">DC</text>
    <text x="50" y="44" fill="#0F172A" font-size="10" font-weight="700" font-family="-apple-system, sans-serif">David Chen</text>
    <text x="50" y="58" fill="#334155" font-size="10" font-style="italic" font-family="-apple-system, sans-serif">"Light calendar, real</text>
    <text x="50" y="71" fill="#334155" font-size="10" font-style="italic" font-family="-apple-system, sans-serif">output. Keep it up."</text>
  </g>

  <!-- ── Floating chaos modal chip (right-top) ── -->
  <g transform="translate(960 90)" filter="url(#chipShadow)">
    <rect width="200" height="80" rx="8" fill="#FFFFFF"/>
    <rect width="200" height="24" rx="8" fill="#FEF3C7"/>
    <rect y="16" width="200" height="8" fill="#FEF3C7"/>
    <text x="14" y="16" fill="#92400E" font-size="9" font-weight="700" letter-spacing="1.5" font-family="-apple-system, sans-serif">⚡ INTERRUPTION</text>
    <text x="14" y="46" fill="#0F172A" font-size="12" font-weight="800" font-family="-apple-system, sans-serif">CEO Added a</text>
    <text x="14" y="60" fill="#0F172A" font-size="12" font-weight="800" font-family="-apple-system, sans-serif">"Quick Sync"</text>
    <text x="14" y="73" fill="#94A3B8" font-size="9" font-style="italic" font-family="-apple-system, sans-serif">No agenda. Cannot wait.</text>
  </g>

  <!-- ── Footer tagline bar ── -->
  <g transform="translate(60 500)">
    <text fill="#FFFFFF" opacity="0.45" font-size="11" font-weight="600" letter-spacing="1" font-family="-apple-system, sans-serif">5 STAGES · 25 DAYS · 1 INEVITABLE PROMOTION</text>
  </g>
</svg>
